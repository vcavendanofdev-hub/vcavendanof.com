# Nginx server block for vavendano.com
# Plantilla del repo. El archivo VIVO en la VM (/etc/nginx/sites-available/victoravendano) fue
# reescrito por certbot (bloque 443, certificados, redirección 80 -> 443): no lo sobrescribas con
# este archivo; aplica los cambios a mano sobre el vivo (ver DEPLOY.md, "Cabeceras de seguridad y
# URLs sin barra final") y valida con `sudo nginx -t` antes de recargar.
#
# Primera instalación:
#   sudo cp deploy/security-headers.conf /etc/nginx/snippets/security-headers.conf
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/victoravendano
#   sudo ln -s /etc/nginx/sites-available/victoravendano /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d vavendano.com -d www.vavendano.com

server {
    listen 80;
    listen [::]:80;
    server_name vavendano.com www.vavendano.com;

    root /var/www/victoravendano/dist;
    index index.html;

    server_tokens off;
    include snippets/security-headers.conf;

    # Sitio estático. `$uri/index.html` (en vez de `$uri/`) sirve /project-manager sin el
    # 301 a /project-manager/, que no coincidía con el canonical ni con hreflang.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    # Recursos con nombre estable y contenido inmutable.
    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include snippets/security-headers.conf;
    }

    # Imágenes sociales: mismo nombre cuando se cambian, caché corta.
    location ~* \.png$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        include snippets/security-headers.conf;
    }
}
