# Cabeceras de seguridad compartidas. Instalar en la VM como:
#   sudo cp deploy/security-headers.conf /etc/nginx/snippets/security-headers.conf
# y referenciar con `include snippets/security-headers.conf;` en el bloque server Y en
# cada `location` que defina su propio add_header (nginx reemplaza, no hereda, los add_header).

add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
